<style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }
    html, body {
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
    }
    body {
      animation: fadeIn 0.8s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .painel {
      width: 90%;
      max-width: 380px;
      margin: 60px auto;
      background: #111;
      border: 2px solid #b30000;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 18px;
      animation: fadeIn 1s ease forwards;
    }
    .titulo {
      text-align: center;
      color: #dcdcdc;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .separador {
      height: 2px;
      width: 100%;
      background: linear-gradient(to right, transparent, #3a3a3a, transparent);
      border-radius: 2px;
    }
    .funcao {
      background: #1a1a1a;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 16px;
      color: white;
      box-shadow: 0 0 12px rgba(255,255,255,0.03);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .funcao:hover {
      transform: scale(1.02);
      box-shadow: 0 0 18px rgba(255,255,255,0.05);
    }
    .botao {
      margin-top: 20px;
      background: #3a3a3a;
      color: black;
      border: none;
      padding: 14px;
      text-align: center;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .botao:hover {
      background: #444;
      transform: scale(1.01);
    }
  
/* All Black Cinza + bordas arredondadas refinadas + animação fluida */
body {
  background: #0e0e0e;
  animation: ultraFade 1s ease-in-out;
}

@keyframes ultraFade {
  0% { opacity: 0; transform: translateY(25px); }
  100% { opacity: 1; transform: translateY(0); }
}

.painel {
  background: #1a1a1a !important;
  border: 1px solid #3a3a3a !important;
  border-radius: 22px !important;
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.02);
}

.titulo {
  color: #dcdcdc !important;
}

.funcao {
  background: #1f1f1f !important;
  border: 1px solid #444 !important;
  border-radius: 16px !important;
  color: #eee !important;
}

.funcao:hover {
  background: #2a2a2a;
  box-shadow: 0 0 12px rgba(255,255,255,0.05);
}

.botao {
  background: #2b2b2b !important;
  color: #f1f1f1 !important;
  border-radius: 16px;
  border: 1px solid #555;
}

.botao:hover {
  background: #3a3a3a !important;
  transform: scale(1.01);
}

html, body {
  background: #0e0e0e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.painel {
  width: 300px;
  height: 300px;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.botao {
  margin-top: 20px;
  background: #2b2b2b;
  color: #f1f1f1;
  border: none;
  padding: 14px;
  text-align: center;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s ease;
}
.botao:hover {
  background: #3a3a3a;
  transform: scale(1.01);
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  touch-action: manipulation;
}
